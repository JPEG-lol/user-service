name: CI/CD Pipeline for User Service

on:
  push:
    branches:
      - main

env:
  # Define variables used across jobs
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/user-service

jobs:
  # Job 1: Run tests to validate code quality
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: users
        ports:
          - 5432:5432 # Map to the default port for simplicity
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Provide the test database connection details to the test runner
          DB_HOST_TEST: localhost
          DB_PORT_TEST: 5432
          DB_USER_TEST: postgres
          DB_PASSWORD_TEST: password
          DB_NAME_TEST: users
          JWT_SECRET_TEST: a-dummy-secret-for-ci-tests
          KAFKA_BROKER: "dummy-kafka:9092"
          KAFKA_CLIENT_ID_USER: "user-service-test"
          USER_LIFECYCLE_TOPIC: "user-lifecycle-test"
          STREAM_API_KEY: "dummy-stream-key"
          STREAM_PRIVATE_API_KEY: "dummy-stream-secret"

  # Job 2: Build, scan, and push the Docker image if tests pass
  build-and-push:
    needs: test # This job will only run if the 'test' job succeeds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and load Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Do not push yet, just load for the scanner
          load: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}-scan
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}-scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}-scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache

  # Job 3: Deploy to GKE if the image is built and pushed successfully
  deploy:
    if: false
    needs: build-and-push # This job depends on the successful completion of the previous one
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: jpeg-cluster
          location: europe-west4

      - name: Deploy to GKE by updating the image
        run: |
          kubectl set image deployment/user-service-deployment user-service=${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
            --namespace=default \
            --record